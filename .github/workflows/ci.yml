name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: pnpm lint

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      # Packages resolve each other through their published entrypoints under
      # dist/, so the workspace has to be built before jest can type check.
      - run: pnpm build
      - run: pnpm test

  generated:
    name: Generated registries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: pnpm generate
      - name: Verify the committed registries match modules.config.ts
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated registries are stale. Run 'pnpm generate' and commit the result."
            git diff --stat
            exit 1
          fi

  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, build-and-test, generated]
    steps:
      - name: Report aggregate result
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
